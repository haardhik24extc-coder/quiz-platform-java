spring.application.name=quiz-platform
server.port=8080
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quizdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:quizuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:quizpass}
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false
